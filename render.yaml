services:
  - type: web
    name: vaultx-banking-simulation
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: FRONTEND_DIR
        value: /app/frontend
      - key: DATABASE_URL
        sync: false
