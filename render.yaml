services:
  - type: web
    name: noir-atm-simulation
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_PATH
        value: /data/atm.db
    disk:
      name: atm-sqlite-data
      mountPath: /data
      sizeGB: 1
