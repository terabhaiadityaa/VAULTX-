name: CI Build & Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev libssl-dev python3

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: ninja -C build

      - name: Run CTest Unit Tests
        run: ctest --test-dir build --output-on-failure

      - name: Start Background Server & Run End-to-End Tests
        run: |
          ./build/backend/atm_backend &
          sleep 2
          python3 tests/comprehensive_test.py
