version: '3.8'

services:
  atm-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: noir-atm-simulation:latest
    container_name: noir-atm-simulation
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_PATH=/data/atm.db
    volumes:
      - atm-data:/data

volumes:
  atm-data:
    name: noir_atm_data
